<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>MyCrawlerApp</title>

<link rel="stylesheet" href="vendor/jspreadsheet/jsuites.css">
<link rel="stylesheet" href="vendor/jspreadsheet/jspreadsheet.css">

<style>
html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

/* 좌측 패널 전체: 버튼/결과(고정) + 그리드(내부 스크롤)를 세로로 배치 */
.left-panel {
    width: 50vw;
    height: 100vh;
    box-sizing: border-box;
    border-right: 1px solid #ccc;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* 버튼/결과 영역: 항상 고정, 스크롤 없음 */
.top-section {
    flex: 0 0 auto;
    padding: 20px;
}

/* 그리드 영역만 스크롤 발생 (가로/세로 모두), 좌측 패널이나 우측 웹뷰엔 영향 없음 */
.grid-wrapper {
    flex: 1 1 auto;
    min-height: 0;
    overflow: auto;
    padding: 0 20px 20px;
    box-sizing: border-box;
}

.button-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

button {
    height: 36px;
    padding: 0 16px;
    cursor: pointer;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: #fff;
}

button:disabled {
    cursor: not-allowed;
    opacity: 0.6;
}

#stopButton {
    background: #dc3545;
    border-color: #b02a37;
    color: #fff;
    font-weight: bold;
}

#stopButton:not(:disabled):hover {
    background: #b02a37;
}

#stopButton:disabled {
    background: #e9a8ae;
    border-color: #e9a8ae;
    color: #fff;
    opacity: 1;
}

#result {
    margin-top: 20px;
    padding: 12px;
    background: #f5f5f5;
    border: 1px solid #ddd;
    white-space: pre-wrap;
}

.site-order {
    margin-top: 10px;
    font-size: 13px;
    color: #666;
}
</style>
</head>

<body>

<div class="left-panel">
    <div class="top-section">
        <h2>컨트롤 패널</h2>

        <div class="button-row">
            <button id="searchButton">▶ 검색</button>
            <button id="stopButton" disabled>■ 중단</button>
        </div>

        <div id="siteOrder" class="site-order"></div>

        <pre id="result">결과 대기 중...</pre>
    </div>

    <div class="grid-wrapper">
        <div id="spreadsheet"></div>
    </div>
</div>

<script src="vendor/jspreadsheet/jsuites.js"></script>
<script src="vendor/jspreadsheet/jspreadsheet.js"></script>

<script>
// ── 그리드 설정 ──────────────────────────────
const GRID_MIN_ROWS = 100;
const GRID_MIN_COLS = 1; // A열(검색어)만 초기 노출, 나머지는 결과 들어올 때 자동 확장
const GRID_MAX_ROWS = 1000;
const GRID_MAX_COLS = 100;

let spreadsheetInstance = null;


// 따옴표 규칙을 인식하는 TSV 파서. 엑셀은 셀 내용에 탭/줄바꿈/큰따옴표가 있으면
// 그 셀 전체를 "..."로 감싸고 내부 따옴표는 ""로 이스케이프해서 클립보드에 싣는다.
// 이 규칙을 모르고 무조건 \t, \n 기준으로 자르면 따옴표 있는 셀이 엉뚱하게 잘린다.
function parseTsv(text) {
    const rows = [];
    let row = [];
    let field = "";
    let inQuotes = false;
    let i = 0;

    while (i < text.length) {
        const char = text[i];

        if (inQuotes) {
            if (char === '"') {
                if (text[i + 1] === '"') {
                    field += '"';
                    i += 2;
                    continue;
                }
                inQuotes = false;
                i++;
                continue;
            }
            field += char;
            i++;
            continue;
        }

        if (char === '"' && field === "") {
            inQuotes = true;
            i++;
            continue;
        }

        if (char === "\t") {
            row.push(field);
            field = "";
            i++;
            continue;
        }

        if (char === "\n") {
            row.push(field);
            rows.push(row);
            row = [];
            field = "";
            i++;
            continue;
        }

        field += char;
        i++;
    }

    row.push(field);
    rows.push(row);

    return rows;
}

// 파싱된 행/셀 배열을 다시 TSV 텍스트로 합친다.
// 셀 내용에 탭/줄바꿈/따옴표가 있으면 다시 따옴표로 감싸서 이스케이프한다.
function stringifyTsv(rows) {
    return rows
        .map((cells) =>
            cells
                .map((cell) => {
                    const needsQuote = /[\t\n"]/.test(cell);
                    return needsQuote ? `"${cell.replace(/"/g, '""')}"` : cell;
                })
                .join("\t")
        )
        .join("\n");
}


// 붙여넣기 텍스트(TSV)를 남은 행/열 범위에 맞게 잘라낸다.
// colIndex/rowIndex는 붙여넣기가 시작되는 셀의 0-based 위치.
function clampPasteText(copiedText, colIndex, rowIndex) {
    const startCol = Number(colIndex);
    const startRow = Number(rowIndex);

    if (Number.isNaN(startCol) || Number.isNaN(startRow)) {
        return copiedText;
    }

    const availableCols = GRID_MAX_COLS - startCol;
    const availableRows = GRID_MAX_ROWS - startRow;

    if (availableCols <= 0 || availableRows <= 0) {
        // 더 이상 붙여넣을 공간이 없음 -> 붙여넣기 취소
        return false;
    }

    let rows = parseTsv(copiedText.replace(/\r/g, ""));

    if (rows.length > availableRows) {
        rows = rows.slice(0, availableRows);
    }

    rows = rows.map((cells) =>
        cells.length > availableCols ? cells.slice(0, availableCols) : cells
    );

    return stringifyTsv(rows);
}

// 수동 삽입(우클릭 메뉴, 스페이스/탭 키)으로 최대 행/열을 넘지 않도록 차단.
function guardRowInsert(el, rowIndex, numOfRows) {
    if (!spreadsheetInstance) {
        return true;
    }

    if (spreadsheetInstance.rows.length + numOfRows > GRID_MAX_ROWS) {
        return false;
    }
}

function guardColumnInsert(el, colIndex, numOfColumns) {
    if (!spreadsheetInstance) {
        return true;
    }

    if (spreadsheetInstance.headers.length + numOfColumns > GRID_MAX_COLS) {
        return false;
    }
}

function initGrid() {
    const columns = [];

    for (let i = 0; i < GRID_MIN_COLS; i++) {
        columns.push({ type: "text", width: 150 });
    }

    spreadsheetInstance = jspreadsheet(document.getElementById("spreadsheet"), {
        data: [],
        columns: columns,
        minDimensions: [GRID_MIN_COLS, GRID_MIN_ROWS],
        toolbar: false,
        onbeforepaste: (el, copiedText, colIndex, rowIndex) =>
            clampPasteText(copiedText, colIndex, rowIndex),
        onbeforeinsertrow: (el, rowIndex, numOfRows) =>
            guardRowInsert(el, rowIndex, numOfRows),
        onbeforeinsertcolumn: (el, colIndex, numOfColumns) =>
            guardColumnInsert(el, colIndex, numOfColumns)
    });
}

initGrid();
</script>

<script>
// 스프레드시트 1열(가장 왼쪽 열)을 위에서부터 읽어 검색어 목록을 만든다.
// 빈 칸을 만나면 그 지점에서 멈춘다.
// 각 행마다 사이트(열)별 기존 값(values)도 같이 읽어서, main.js가
// "빈칸이거나 실패로 남은 셀만" 골라 처리할 수 있게 한다.
function collectSearchTerms(siteCount) {
    const columnData = spreadsheetInstance.getColumnData(0);
    const terms = [];

    for (let rowIndex = 0; rowIndex < columnData.length; rowIndex++) {
        const value = columnData[rowIndex];
        const text = value === null || value === undefined ? "" : String(value).trim();

        if (!text) {
            break;
        }

        const values = [];

        for (let i = 0; i < siteCount; i++) {
            const colIndex = i + 1; // A열(0)은 검색어 전용

            values.push(
                colIndex < spreadsheetInstance.headers.length
                    ? spreadsheetInstance.getValueFromCoords(colIndex, rowIndex)
                    : null
            );
        }

        terms.push({ rowIndex, term: text, values });
    }

    return terms;
}

// 그리드 열 개수가 minColCount보다 적으면 필요한 만큼 끝에 열을 추가한다.
// (jspreadsheet의 insertColumn은 columnRecordIndex를 안 주면 맨 끝에 추가됨)
function ensureColumnCount(minColCount) {
    while (spreadsheetInstance.headers.length < minColCount) {
        if (spreadsheetInstance.headers.length >= GRID_MAX_COLS) {
            return false; // 최대 열 도달 -> 더 이상 못 늘림
        }

        spreadsheetInstance.insertColumn(1, undefined, undefined, [
            { type: "text", width: 150 }
        ]);
    }

    return true;
}

// 지정된 (rowIndex, colIndex) 셀에 값을 직접 써넣는다.
// 예전처럼 "이 행에서 비어있는 첫 칸"을 찾는 게 아니라, 호출하는 쪽(main.js)에서
// 버튼(사이트)별로 고정해서 정해준 열에 그대로 쓴다.
function setCellAt(rowIndex, colIndex, text) {
    if (!ensureColumnCount(colIndex + 1)) {
        return;
    }

    spreadsheetInstance.setValueFromCoords(colIndex, rowIndex, text);

    const cell = spreadsheetInstance.getCellFromCoords(colIndex, rowIndex);

    if (cell) {
        cell.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "nearest" });
    }
}

async function init() {
    const searchButton = document.getElementById("searchButton");
    const stopButton = document.getElementById("stopButton");
    const resultArea = document.getElementById("result");
    const siteOrderArea = document.getElementById("siteOrder");

    function setCrawlingState(isCrawling) {
        searchButton.disabled = isCrawling;
        stopButton.disabled = !isCrawling;
    }

    window.crawlerApi.onProgress(({ rowIndex, colIndex, text }) => {
        setCellAt(rowIndex, colIndex, text);
    });

    window.crawlerApi.onDone(({ stopped }) => {
        setCrawlingState(false);
        resultArea.textContent = stopped
            ? "크롤링이 중단되었습니다."
            : "크롤링이 완료되었습니다.";
    });

    stopButton.addEventListener("click", async () => {
        stopButton.disabled = true;
        await window.crawlerApi.stopCrawl();
    });

    // 버튼 로딩 순서(=src/buttons 파일명 순서) 그대로가 크롤링 순서이자 열 배정 순서
    const siteButtons = await window.crawlerApi.getButtons();

    siteOrderArea.textContent =
        "크롤링 대상 사이트 및 순서: " + siteButtons.map((b) => b.name).join(" → ");

    searchButton.addEventListener("click", async () => {
        const searchTerms = collectSearchTerms(siteButtons.length);

        if (searchTerms.length === 0) {
            resultArea.textContent = "그리드 1열에 검색어가 없습니다.";
            return;
        }

        resultArea.textContent = `크롤링 실행 중... (검색어 ${searchTerms.length}개 x 사이트 ${siteButtons.length}개)`;
        setCrawlingState(true);

        try {
            const res = await window.crawlerApi.startCrawl(searchTerms);

            if (res && res.nothingToDo) {
                setCrawlingState(false);
                resultArea.textContent = "더 이상 크롤링을 진행할 수 없습니다.";
            }
            // 정상 진행된 경우엔 onDone 콜백에서 최종 상태를 표시함
        } catch (err) {
            resultArea.textContent = err.message;
            setCrawlingState(false);
        }
    });
}

init();
</script>

</body>
</html>
