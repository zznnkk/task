<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>B</title>
  <style>
    body { margin: 0; padding: 16px; background: #ff9650; color: white; font-family: sans-serif; box-sizing: border-box; height: 100vh; }
    #count { font-size: 32px; font-weight: bold; }
    textarea { width: 100%; height: 200px; margin-top: 12px; font-family: monospace; }
  </style>
</head>
<body>
  <h1>Pane B</h1>
  <div id="count">0</div>
  <textarea id="log" readonly></textarea>

  <script>
    let count = 0;

    window.api.on('ping', (payload, fullMessage) => {
      count += 1;
      document.getElementById('count').textContent = count;
      document.getElementById('log').value = JSON.stringify(fullMessage, null, 2);
    });
  </script>
</body>
</html>
