<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>right</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, sans-serif;
    background: #ffffff;
  }
  h1 {
    font-size: 28px;
    color: #333;
    margin: 0;
  }
</style>
</head>
<body>
  <h1>안녕하세요</h1>

  <script>
    // 페이지 로드 완료 -> Rust 쪽에 "ready" 신호 (창 깜빡임 방지용 표시 타이밍 제어)
    window.addEventListener('DOMContentLoaded', () => {
      window.ipc.postMessage(JSON.stringify({ type: 'ready' }));
    });
  </script>
</body>
</html>
