<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>left</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, sans-serif;
    background: #f5f5f5;
  }
  #urlInput {
    width: 80%;
    max-width: 480px;
    padding: 10px 14px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 6px;
    outline: none;
  }
  #urlInput:focus {
    border-color: #4a90d9;
  }
</style>
</head>
<body>
  <input id="urlInput" type="text" placeholder="주소를 입력하고 Enter" autofocus />

  <script>
    // 페이지 로드 완료 -> Rust 쪽에 "ready" 신호 (창 깜빡임 방지용 표시 타이밍 제어)
    window.addEventListener('DOMContentLoaded', () => {
      window.ipc.postMessage(JSON.stringify({ type: 'ready' }));
    });

    const input = document.getElementById('urlInput');

    input.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;

      const url = input.value.trim();
      if (url.length === 0) return;

      // Rust 쪽 with_ipc_handler 로 전달됨
      // 확장 시: JSON.stringify({ type: "navigate", url }) 외 다른 type 추가 가능
      window.ipc.postMessage(JSON.stringify({ type: 'navigate', url }));
    });
  </script>
</body>
</html>
